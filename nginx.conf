worker_processes 1;
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    # Dynamic CORS origin mapping: allows any *.vercel.app domain and localhost
    map $http_origin $cors_origin {
        default "";
        "~^https?://localhost(:[0-9]+)?$" "$http_origin";
        "~^https?://127\.0\.0\.1(:[0-9]+)?$" "$http_origin";
        "~^https://.*\.vercel\.app$" "$http_origin";
    }

    upstream auth_service { server 127.0.0.1:5001; }
    upstream core_service { server 127.0.0.1:5002; }
    upstream module1_service { server 127.0.0.1:5003; }
    upstream module2_service { server 127.0.0.1:5004; }
    upstream platform_order_service { server 127.0.0.1:5005; }

    server {
        listen ${PORT};
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # Hide upstream CORS headers to prevent duplicate headers
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;

        # CORS headers applied to all responses (including 204 preflight & 4xx/5xx errors)
        add_header 'Access-Control-Allow-Origin' $cors_origin always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, PATCH, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,ngrok-skip-browser-warning' always;
        add_header 'Access-Control-Max-Age' 1728000 always;

        # CORS Preflight handler: Intercept OPTIONS directly at Gateway
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        # Health check
        location = /healthz {
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        location = / {
            return 200 "Logistics Microservices Gateway is running";
            add_header Content-Type text/plain;
        }

        # ── Service 1: Authentication ──
        location /api/auth { proxy_pass http://auth_service; }
        location /api/users { proxy_pass http://auth_service; }
        location /api/roles { proxy_pass http://auth_service; }
        location /api/permissions { proxy_pass http://auth_service; }
        location /api/internal { proxy_pass http://auth_service; }
        location /api/support { proxy_pass http://auth_service; }
        location /api/configs { proxy_pass http://auth_service; }
        location /api/notifications { proxy_pass http://auth_service; }
        location /api/audit-logs { proxy_pass http://auth_service; }
        location /hubs { proxy_pass http://auth_service; }

        # ── Complaints in Module1 (trước /api/orders) ──
        location ~ ^/api/orders/[^/]+/complaints { proxy_pass http://module1_service; }

        # ── Service 2: Core (Finance, Wallet, Payment, Bank) ──
        location /api/admin { proxy_pass http://core_service; }
        location /api/transactions { proxy_pass http://core_service; }
        location /api/transaction-types { proxy_pass http://core_service; }
        location /api/bank-accounts { proxy_pass http://core_service; }
        location /api/kyc { proxy_pass http://core_service; }
        location /api/wallet-payment { proxy_pass http://core_service; }
        location /api/zalopay { proxy_pass http://core_service; }
        location /api/finance { proxy_pass http://core_service; }
        location /api/AdminWallet { proxy_pass http://core_service; }
        location /api/BankWebhookLog { proxy_pass http://core_service; }
        location /api/CustomerAddress { proxy_pass http://core_service; }
        location /api/CustomerProfile { proxy_pass http://core_service; }
        location /api/EmailNotification { proxy_pass http://core_service; }
        location /api/FeeRule { proxy_pass http://core_service; }
        location /api/FinanceManagement { proxy_pass http://core_service; }
        location /api/FraudDetection { proxy_pass http://core_service; }
        location /api/PaymentLock { proxy_pass http://core_service; }
        location /api/Refund { proxy_pass http://core_service; }
        location /api/VipTier { proxy_pass http://core_service; }
        location /api/WalletTransaction { proxy_pass http://core_service; }

        # ── Service 3: Module 1 (Catalog, Orders, Products, Cart, Staff, Exchange Rates) ──
        location /api/exchange-rates { proxy_pass http://module1_service; }
        location /api/deposit-configs { proxy_pass http://module1_service; }
        location /api/favorites { proxy_pass http://module1_service; }
        location /api/forbidden-categories { proxy_pass http://module1_service; }
        location /api/activity { proxy_pass http://module1_service; }
        location /api/orders { proxy_pass http://module1_service; }
        location /api/manage { proxy_pass http://module1_service; }
        location /api/assistant { proxy_pass http://module1_service; }
        location /api/cart { proxy_pass http://module1_service; }
        location /api/ingestion { proxy_pass http://module1_service; }
        location /api/staff { proxy_pass http://module1_service; }
        location /api/categories { proxy_pass http://module1_service; }
        location /api/products { proxy_pass http://module1_service; }
        location /api/platforms { proxy_pass http://module1_service; }
        location /api/recommendations { proxy_pass http://module1_service; }
        location /api/reviews { proxy_pass http://module1_service; }

        # ── Service 4: Module 2 (Logistics, Tracking, Packages) ──
        location /api/packages { proxy_pass http://module2_service; }
        location /api/my/packages { proxy_pass http://module2_service; }
        location /api/delivery-requests { proxy_pass http://module2_service; }
        location /api/sacks { proxy_pass http://module2_service; }
        location /api/trips { proxy_pass http://module2_service; }
        location /api/container-trips { proxy_pass http://module2_service; }
        location /api/customs { proxy_pass http://module2_service; }
        location /api/customs-clearances { proxy_pass http://module2_service; }
        location /api/domestic-waybills { proxy_pass http://module2_service; }
        location /api/insurance-claims { proxy_pass http://module2_service; }
        location /api/missing-claims { proxy_pass http://module2_service; }
        location /api/claims { proxy_pass http://module2_service; }
        location /api/forecast { proxy_pass http://module2_service; }
        location /api/warehouses { proxy_pass http://module2_service; }
        location /api/ai { proxy_pass http://module2_service; }
        location /api/webhooks { proxy_pass http://module2_service; }

        # ── Service 5: PlatformOrder ──
        location /api/platform-orders { proxy_pass http://platform_order_service; }
    }
}
