# Module 2 gateway
#
# Public:
#   https://intensely-amazed-mule.ngrok-free.app
#
# Flow:
#   FE Vercel / GHTK
#       -> ngrok HTTPS
#       -> Nginx http://127.0.0.1:8080
#       -> Module 2 http://127.0.0.1:5080
#
# Run Module 2:
#   dotnet run \
#     --project BE/Logistics/Services/Module2/LG.Module2.API \
#     --launch-profile http
#
# Validate/start/reload/stop Nginx from repository root:
#   sudo nginx -t -c "$PWD/deploy/nginx-muaho.conf"
#   sudo nginx -c "$PWD/deploy/nginx-muaho.conf"
#   sudo nginx -s reload -c "$PWD/deploy/nginx-muaho.conf"
#   sudo nginx -s quit -c "$PWD/deploy/nginx-muaho.conf"
#
# Start ngrok:
#   ngrok http 8080 --domain=intensely-amazed-mule.ngrok-free.app

worker_processes 1;
pid /tmp/module2-nginx.pid;

events {
    worker_connections 1024;
}

http {
    access_log /tmp/module2-access.log;
    error_log  /tmp/module2-error.log warn;

    sendfile on;
    keepalive_timeout 65;

    server {
        # Chỉ ngrok trên cùng máy có thể truy cập gateway.
        listen 127.0.0.1:8080;
        server_name _;

        # Cho phép upload ảnh/chứng từ lớn hơn giới hạn mặc định 1 MB.
        client_max_body_size 25m;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_connect_timeout 30s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Giữ nguyên URI:
        #   /api/packages       -> http://127.0.0.1:5080/api/packages
        #   /api/webhooks/ghtk  -> http://127.0.0.1:5080/api/webhooks/ghtk
        #   /swagger            -> http://127.0.0.1:5080/swagger
        location / {
            proxy_pass http://127.0.0.1:5080;
            proxy_buffering off;
        }
    }
}
