# ─────────────────────────────────────────────────────────────────────────────
# MuaHo gateway — 1 URL ngrok tĩnh → điều hướng theo path tới Auth + Module1.
#
#   Trình duyệt (FE Vercel)                         Máy local
#   ┌───────────────┐   https   ┌────────┐  http   ┌──────────────────────────┐
#   │ muaho-fe.     │ ────────► │ ngrok  │ ──────► │ nginx :8080              │
#   │ vercel.app    │           └────────┘         │  /auth/* → 127.0.0.1:5016│ Auth
#   └───────────────┘                              │  /m1/*   → 127.0.0.1:5066│ Module1
#                                                  └──────────┬───────────────┘
#                                                             │ localhost (KHÔNG qua ngrok)
#                                                             ▼
#                                                        AI :8000  (Module1 gọi nội bộ)
#
# 
#
# Chạy:
#   nginx -c <đường-dẫn-tuyệt-đối>/nginx-muaho.conf
#   ngrok http 8080 --domain=<domain-tĩnh-của-bạn>.ngrok-free.app
#
# FE (Vercel) đặt:
#   VITE_AUTH_API_URL    = https://<domain>.ngrok-free.app/auth
#   VITE_MODULE1_API_URL = https://<domain>.ngrok-free.app/m1
# ─────────────────────────────────────────────────────────────────────────────

worker_processes  1;
events { worker_connections  1024; }

http {
    # Log gọn để debug
    access_log  logs/muaho-access.log;
    error_log   logs/muaho-error.log  warn;

    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       8080;
        server_name  _;

        # Ingestion (scraped data) / upload ảnh có thể > 1MB (mặc định nginx)
        client_max_body_size  25m;

        # ── Header chung khi proxy tới BE ────────────────────────────────────
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        # ngrok terminate TLS ở ngoài → báo BE request gốc là https
        # (ForwardedHeaders đã bật XForwardedProto ở cả Auth lẫn Module1).
        proxy_set_header X-Forwarded-Proto  https;
        proxy_set_header X-Forwarded-Host   $host;

        # Health nhanh để test tunnel
        location = / { default_type text/plain; return 200 "MuaHo gateway OK\n"; }

        # ── Auth Service (:5016) ─────────────────────────────────────────────
        # Dấu "/" cuối trong proxy_pass = strip tiền tố /auth/ :
        #   /auth/api/auth/login  →  127.0.0.1:5016/api/auth/login
        location /auth/ {
            proxy_pass http://127.0.0.1:5016/;
        }

        # ── Module1 — nghiệp vụ mua hộ (:5066) ───────────────────────────────
        #   /m1/api/products?...     →  127.0.0.1:5066/api/products?...
        #   /m1/api/assistant/chat/stream (SSE) →  ... (đã tắt buffering)
        location /m1/ {
            proxy_pass http://127.0.0.1:5066/;

            # Chatbot SSE + stream dài: tắt buffering, giữ kết nối lâu.
            proxy_buffering      off;
            proxy_cache          off;
            proxy_set_header     Connection "";
            proxy_read_timeout   3600s;
            proxy_send_timeout   3600s;
        }

    }
}
